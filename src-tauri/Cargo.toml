[package]
name = "spatialdb-desktop"
version = "0.1.0"
description = "spatialdb desktop client — the web app in a native window, plus the tools that need a real machine"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "spatialdb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# xxh3: the default fingerprint (contract/tools.ts `hash`). Pure Rust, no native
# build step — a NixOS constraint (see TAURI-HANDOFF.md §8).
xxhash-rust = { version = "0.8", features = ["xxh3"] }
regex-lite = "0.1"
sha2 = "0.10"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
