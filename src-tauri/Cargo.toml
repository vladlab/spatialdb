[package]
name = "spatialdb-desktop"
version = "0.1.0"
description = "spatialdb desktop client — the web app in a native window, plus the tools that need a real machine"
edition = "2021"
# Tauri 3 alpha and its CEF runtime need Rust ≥ 1.95 (the flake's .#desktop shell
# provides a current stable; on Fedora, `rustup update`).
rust-version = "1.95"

[lib]
name = "spatialdb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri 3 ALPHA, pinned exactly (`=`): the CEF runtime exists only for Tauri 3, and an
# alpha that floats breaks the build some morning for no visible reason. Bump all the
# tauri* pins together, on purpose, and read the changelogs (CEF-BRIEF.md C1.1).
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# xxh3: the default fingerprint (contract/tools.ts `hash`). Pure Rust, no native
# build step — a NixOS constraint (see TAURI-HANDOFF.md §8).
xxhash-rust = { version = "0.8", features = ["xxh3"] }
regex-lite = "0.1"
sha2 = "0.10"
# md5: what a client's checksum request almost always means (the md-5 crate, pure Rust; "md5" is the hash name).
md-5 = "0.10"
url = "2"
# The runtime and plugins report through `log`; lib.rs `log_to_stderr` prints it.
log = "0.4"
# Remembers the main window's size, position (which monitor) and maximized state
# between runs: `.window-state.json` in the app's config dir. Tauri 3 alpha line,
# pinned like the rest.
tauri-plugin-window-state = "=3.0.0-alpha.2"

# THE WEBVIEW ENGINE, per platform (CEF-BRIEF.md). Tauri 3 picks the runtime in code
# (`tauri::Builder::runtime`, lib.rs `engine()`), not by a feature of `tauri`.
#
# Linux: Chromium (CEF). WebKitGTK on NVIDIA/Xorg had to run without its GPU path
# (WEBKIT_DISABLE_DMABUF_RENDERER) and was much slower than the same app in a
# browser. The first build downloads the CEF distribution (~1 GB) — see DESKTOP.md
# "The CEF branch" for where it goes. `devtools`: the inspector in a release build too,
# still behind the server capability's `allow-internal-toggle-devtools`.
#
# The native "read this file?" dialog (lib.rs rule 3) on Linux: tauri-plugin-dialog's
# default GTK 3 backend cannot share a process with the CEF runtime's GTK 4, so it is
# built with the XDG-portal backend, which draws message dialogs with `zenity` — a
# separate process the page can neither draw nor answer. zenity must be installed.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = { version = "=3.0.0-alpha.7", features = ["devtools"] }
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }

# macOS (and Windows, untried): the system webview through wry, as before. Keeps the
# Mac build for colleagues small; it moves to Tauri 3 alpha with everything else.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime-wry = { version = "=3.0.0-alpha.6", features = ["devtools"] }
tauri-plugin-dialog = { version = "=3.0.0-alpha.4" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
