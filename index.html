<!doctype html>
<html>
  <head>
    <meta charset="utf-8" /><title>spatialdb</title>
    <!-- The saved theme, before the first paint (client/prefs.ts owns the key). -->
    <script>try { var t = localStorage.getItem('spatialdb.prefs.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/client/main.ts"></script></body>
</html>
